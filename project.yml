name: ChessPuzzleDaily
options:
  bundleIdPrefix: com.aries-rst.chesspuzzledaily
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  ChessPuzzleDaily:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChessPuzzleDaily
    info:
      path: ChessPuzzleDaily/Info.plist
      properties:
        CFBundleDisplayName: "Ход дня"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aries-rst.chesspuzzledaily.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
schemes:
  ChessPuzzleDaily:
    build:
      targets:
        ChessPuzzleDaily: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
