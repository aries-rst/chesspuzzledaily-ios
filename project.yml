name: ChessPuzzleDaily
options:
  bundleIdPrefix: com.aries-rst.chesspuzzledaily
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.0.0"
targets:
  ChessPuzzleDaily:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChessPuzzleDaily
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: ChessPuzzleDaily/Info.plist
      properties:
        CFBundleDisplayName: "Ход дня"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AdMob App ID — real ad serving stays off until `adsEnabled` in Ads.swift is flipped to
        # true for the production release (see the comment there).
        GADApplicationIdentifier: "ca-app-pub-9638598348702189~1410340420"
        # Shown only if/when we start requesting tracking authorization for personalized ads
        # (not yet wired up while adsEnabled is false) — present now so enabling that later is a
        # code-only change.
